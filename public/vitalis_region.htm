<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Protocol // VITALIS REGION</title>
    <style>
        :root {
            --hud-primary: #ffaa00; /* Amber */
            --hud-dim: #552200;
            --alert-color: #ff3333;
            --bg-color: #1a0500;    /* Deep Thermal Background */
            --font-stack: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); 
            overflow: hidden; 
            font-family: var(--font-stack); 
            color: var(--hud-primary); 
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        #sat-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, black 100%);
            z-index: 9; pointer-events: none;
        }

        /* Scanlines for military monitor look */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            z-index: 10; pointer-events: none;
        }

        .plot-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 170, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 170, 0, 0.1) 1px, transparent 1px);
            background-size: 100px 100px; 
            pointer-events: none; z-index: 8;
            opacity: 0.3;
        }

        .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        .top-bar { 
            display: flex; justify-content: space-between; 
            border-bottom: 2px solid var(--hud-dim); 
            padding-bottom: 10px; 
            text-transform: uppercase; 
            font-size: 14px; 
            background: rgba(20, 5, 0, 0.8);
        }
        
        .blink { animation: blinker 2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .stats-panel { 
            position: absolute; top: 90px; left: 25px; 
            background: rgba(30, 10, 0, 0.9); 
            border: 1px solid var(--hud-primary); 
            padding: 0; 
            width: 340px; 
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5); 
        }
        .stats-panel h2 { 
            margin: 0; font-size: 16px; color: #000; 
            background: var(--hud-primary); 
            padding: 8px 15px; text-transform: uppercase; 
        }
        
        .stats-content { padding: 15px; }

        .data-row { 
            display: flex; justify-content: space-between; 
            margin-bottom: 8px; font-size: 12px; 
            border-bottom: 1px dashed var(--hud-dim); 
            padding-bottom: 4px; 
        }
        .data-label { color: var(--hud-primary); text-transform: uppercase; }
        .data-val { color: #fff; text-shadow: 0 0 2px var(--hud-primary); }

        .progress-bar-track { height: 8px; background: #220500; border: 1px solid var(--hud-dim); position: relative; margin-top: 5px; }
        .progress-bar-fill { height: 100%; background: var(--hud-primary); width: 0%; transition: width 0.1s linear; box-shadow: 0 0 10px var(--hud-primary); }

        /* Updated Terminal Log Style */
        .terminal-log { 
            position: absolute; bottom: 80px; left: 25px; 
            width: 350px; height: 160px; overflow: hidden; 
            font-size: 12px; line-height: 1.4;
            color: var(--hud-primary); 
            display: flex; flex-direction: column-reverse; 
            text-shadow: 0 0 4px var(--hud-primary);
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-left: 2px solid var(--hud-dim);
        }
        .log-entry { margin-bottom: 2px; opacity: 0.8; }
        .log-entry.new { color: #fff; opacity: 1; background: rgba(255, 170, 0, 0.1); }

        .coords { 
            position: absolute; bottom: 25px; right: 25px; 
            text-align: right; font-size: 12px; 
            background: rgba(0,0,0,0.8); padding: 10px; 
            border: 1px solid var(--hud-primary);
        }
    </style>
</head>
<body>

    <canvas id="sat-feed"></canvas>
    <div class="plot-grid"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud-layer">
        <div class="top-bar">
            <div>SAT-LINK: <span style="color:#fff">SECURE_CH_4</span></div>
            <div>FEED: <span id="feed-id">THERMAL_IR_V9</span></div>
            <div class="blink" style="color:var(--alert-color)">● LIVE STREAM</div>
        </div>

        <div class="stats-panel">
            <h2>VITALIS // COMMAND</h2>
            <div class="stats-content">
                <div class="data-row"><span class="data-label">SECTOR:</span><span class="data-val" id="sector-val">ARCADIA PLANITIA</span></div>
                <div class="data-row"><span class="data-label">OP STATE:</span><span class="data-val">HABITATION_ACTIVE</span></div>
                <div class="data-row"><span class="data-label">ENV_RISK:</span><span class="data-val">CLASS II (ICE)</span></div>
                <br>
                <div class="data-row"><span class="data-label">SECTOR CAP:</span><span class="data-val">1,300,000</span></div>
                <div class="data-row"><span class="data-label">EVA UNITS:</span><span class="data-val" id="eva-count">34 [ONLINE]</span></div>
                <div class="data-row"><span class="data-label">HARVESTED:</span><span class="data-val" id="mined-val">0</span></div>
                <div style="margin-top:15px;">
                    <div class="data-row"><span class="data-label">TERRAFORMING_SEQ</span><span class="data-val" id="progress-text">0%</span></div>
                    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="terminal-log" id="sys-log"></div>

        <div class="coords">
            <div>LAT: <span id="lat">47.000</span> N</div>
            <div>LNG: <span id="lng">175.000</span> W</div>
            <div style="color:#aaa; font-size:10px; margin-top:4px;">SURFACE_TEMP: -35°C // FLUX_STABLE</div>
        </div>
    </div>

<script>

/** --- CONFIGURATION --- */
const VitalisTheme = {
    name: "VITALIS REGION",
    subRegion: "ARCADIA PLANITIA",
    feedId: "THERMAL_IR_V9",
    colors: {
        primary: '#ffaa00', // Amber
        dim: '#552200',
        bg: '#1a0500',      // Deep thermal background
        feature: '#331100'  
    },
    groundSpeed: 0.3,       
    totalCap: 1300000,
    minedStart: 412000
};

/** --- ENGINE --- */
class MapEngine {
    constructor(canvasId, theme) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.theme = theme;
        
        this.width = window.innerWidth;
        this.height = Math.ceil(window.innerHeight);
        this.scrollY = 0;
        
        this.units = [];      // Hover Drones
        this.astronauts = []; // EVA Units
        this.vents = [];      // Thermal Vents
        this.buildings = [];  
        
        this.mapCanvas = document.createElement('canvas'); 
        this.totalMined = theme.minedStart;
        this.totalCap = theme.totalCap;
        
        this.resize = this.resize.bind(this);
        this.loop = this.loop.bind(this);
        
        this.init();
    }

    init() {
        const r = document.documentElement;
        r.style.setProperty('--hud-primary', this.theme.colors.primary);
        r.style.setProperty('--hud-dim', this.theme.colors.dim);
        r.style.setProperty('--bg-color', this.theme.colors.bg);
        
        document.getElementById('sector-val').innerText = this.theme.subRegion;
        document.getElementById('feed-id').innerText = this.theme.feedId;
        
        window.addEventListener('resize', this.resize);
        this.resize();

        this.spawnDrones(8);
        this.spawnAstronauts(30);

        this.addLog("SYSTEM INITIALIZED...");
        this.addLog("SAT-LINK // SECURE_CH_4 ESTABLISHED");
        this.addLog("FEED // THERMAL_IR_V9");
        requestAnimationFrame(this.loop);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = Math.ceil(window.innerHeight);
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.mapCanvas.width = this.width;
        this.mapCanvas.height = this.height;
        this.generateTerrain();
    }

    spawnDrones(count) {
        this.units = [];
        for(let i=0; i<count; i++) this.units.push(new Drone(this));
    }

    spawnAstronauts(count) {
        this.astronauts = [];
        for(let i=0; i<count; i++) {
            const b = this.buildings[Math.floor(Math.random() * this.buildings.length)];
            const startX = b ? b.x + (Math.random()-0.5)*100 : Math.random() * this.width;
            const startY = b ? b.y + (Math.random()-0.5)*100 : Math.random() * this.height;
            this.astronauts.push(new Astronaut(this, startX, startY));
        }
        document.getElementById('eva-count').innerText = `${count} [ONLINE]`;
    }

    addLog(msg) {
        const logContainer = document.getElementById('sys-log');
        const el = document.createElement('div');
        el.className = 'log-entry new';
        // Updated log format to match Genesis style
        el.innerText = `> ${msg}`; 
        logContainer.prepend(el);
        if(logContainer.children.length > 8) logContainer.lastElementChild.remove();
        setTimeout(() => el.classList.remove('new'), 500);
    }

    // --- BUILDING GENERATOR ---
    drawBuilding(ctx, type, x, y) {
        const alpha = 0.6 + Math.random() * 0.4;
        ctx.fillStyle = this.theme.colors.primary;
        ctx.strokeStyle = this.theme.colors.dim;
        this.buildings.push({x, y});

        switch(type) {
            case 'COMMAND_HUB':
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                for(let i=0; i<6; i++) {
                    const angle = (i/6) * Math.PI * 2;
                    ctx.lineTo(x + Math.cos(angle)*15, y + Math.sin(angle)*15);
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                ctx.arc(x,y,5,0,Math.PI*2);
                ctx.stroke();
                break;
            case 'MED_BAY':
                ctx.globalAlpha = 0.9;
                ctx.fillRect(x-5, y-15, 10, 30);
                ctx.fillRect(x-15, y-5, 30, 10);
                break;
            case 'CARGO_YARD':
                ctx.globalAlpha = 0.5;
                for(let ix=0; ix<3; ix++) {
                    for(let iy=0; iy<3; iy++) {
                        ctx.strokeRect(x + (ix*10)-15, y + (iy*10)-15, 8, 8);
                    }
                }
                break;
            case 'ORE_PROCESSOR':
                ctx.globalAlpha = 1.0;
                ctx.fillRect(x-15, y-10, 30, 20);
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(x+10, y-5, 4, 0, Math.PI*2);
                ctx.stroke();
                break;
            case 'SOLAR_ARRAY':
                for(let ix=0; ix<3; ix++) {
                    for(let iy=0; iy<3; iy++) {
                        ctx.globalAlpha = 0.5 + Math.random()*0.3;
                        ctx.fillRect(x + ix*12, y + iy*8, 10, 6);
                    }
                }
                break;
            case 'HAB_MODULE':
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.theme.colors.primary;
                ctx.stroke();
                ctx.shadowBlur = 0;
                break;
            case 'LAUNCH_PAD':
                ctx.globalAlpha = 0.4;
                ctx.fillRect(x-20, y-20, 40, 40);
                ctx.globalAlpha = 1.0;
                ctx.strokeRect(x-20, y-20, 40, 40);
                ctx.beginPath();
                ctx.moveTo(x-10, y-10); ctx.lineTo(x+10, y+10);
                ctx.moveTo(x+10, y-10); ctx.lineTo(x-10, y+10);
                ctx.stroke();
                break;
            case 'GREENHOUSE':
                ctx.globalAlpha = 0.3;
                ctx.fillRect(x-30, y-10, 60, 20);
                ctx.globalAlpha = 0.8;
                ctx.beginPath();
                for(let i=0; i<=6; i++) {
                    ctx.moveTo(x-30 + (i*10), y-10);
                    ctx.lineTo(x-30 + (i*10), y+10);
                }
                ctx.stroke();
                break;
            case 'WATER_TANK':
                ctx.globalAlpha = 0.9;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI*2);
                ctx.arc(x+10, y+6, 6, 0, Math.PI*2);
                ctx.fill();
                break;
            case 'THERMAL_VENT':
                ctx.globalAlpha = 1.0;
                ctx.beginPath();
                ctx.moveTo(x, y); ctx.lineTo(x-5, y+20); ctx.lineTo(x+5, y+20);
                ctx.fill();
                break;
        }
        ctx.globalAlpha = 1.0; 
    }

    generateTerrain() {
        this.buildings = [];
        const mCtx = this.mapCanvas.getContext('2d');
        const w = this.width;
        const h = this.height;
        
        mCtx.fillStyle = this.theme.colors.bg;
        mCtx.fillRect(0, 0, w, h);

        const drawWrapped = (fn) => {
            fn(0,0); fn(0, -h); fn(0, h); fn(-w, 0); fn(w, 0);
        };

        // 1. Permafrost Cracks
        mCtx.strokeStyle = '#331100'; mCtx.lineWidth = 2; mCtx.globalAlpha = 0.6;
        for(let i=0; i<10; i++) {
            const sx = Math.random() * w; const sy = Math.random() * h;
            drawWrapped((ox, oy) => {
                let cx = sx+ox, cy = sy+oy;
                mCtx.beginPath(); mCtx.moveTo(cx, cy);
                for(let s=0; s<15; s++) { cx+=(Math.random()-0.5)*60; cy+=(Math.random()-0.5)*60; mCtx.lineTo(cx, cy); }
                mCtx.stroke();
            });
        }
        mCtx.globalAlpha = 1.0;

        // 2. Roads
        mCtx.strokeStyle = '#552200'; mCtx.lineWidth = 4;
        const nodes = [];
        for(let i=0; i<6; i++) nodes.push({x: Math.random()*w, y: Math.random()*h});
        drawWrapped((ox, oy) => {
            mCtx.beginPath();
            for(let i=0; i<nodes.length-1; i++) {
                mCtx.moveTo(nodes[i].x+ox, nodes[i].y+oy);
                mCtx.lineTo(nodes[i+1].x+ox, nodes[i+1].y+oy);
            }
            mCtx.stroke();
        });

        // 3. Buildings
        const types = ['SOLAR_ARRAY', 'HAB_MODULE', 'LAUNCH_PAD', 'GREENHOUSE', 'WATER_TANK', 'THERMAL_VENT', 'COMMAND_HUB', 'MED_BAY', 'CARGO_YARD', 'ORE_PROCESSOR'];
        for(let i=0; i<16; i++) {
            const bx = Math.random() * w;
            const by = Math.random() * h;
            const type = types[Math.floor(Math.random() * types.length)];
            if(type === 'THERMAL_VENT') this.vents.push({x: bx, y: by});
            drawWrapped((ox, oy) => {
                this.drawBuilding(mCtx, type, bx+ox, by+oy);
            });
        }
    }

    // --- LOOP ---
    loop() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        
        this.scrollY += this.theme.groundSpeed;
        if(this.scrollY >= this.height) this.scrollY = 0;
        const iy = Math.floor(this.scrollY);
        
        this.ctx.drawImage(this.mapCanvas, 0, iy);
        this.ctx.drawImage(this.mapCanvas, 0, iy - this.height);

        this.vents.forEach(v => {
            let vy = v.y + iy;
            if(vy > this.height) vy -= this.height;
            if(Math.random() > 0.92) {
                this.ctx.fillStyle = 'rgba(255, 255, 200, 0.4)';
                const puffSize = 2 + Math.random() * 4;
                this.ctx.beginPath();
                this.ctx.arc(v.x, vy - 10 - (Math.random()*10), puffSize, 0, Math.PI*2);
                this.ctx.fill();
            }
        });

        this.astronauts.forEach(a => { a.update(); a.draw(this.ctx); });
        this.units.forEach(u => { u.update(); u.draw(this.ctx); });
        
        this.updateHUD();
        requestAnimationFrame(this.loop);
    }

    updateHUD() {
        document.getElementById('lat').innerText = (47.1 + (Date.now()*0.0001)%1).toFixed(4);
        document.getElementById('lng').innerText = (175.2 + (Date.now()*0.0002)%1).toFixed(4);
        
        const remaining = this.totalCap - this.totalMined;
        const pct = (this.totalMined / this.totalCap) * 100;
        
        document.getElementById('mined-val').innerText = Math.floor(this.totalMined).toLocaleString();
        document.getElementById('progress-text').innerText = pct.toFixed(4) + "%";
        document.getElementById('progress-fill').style.width = pct + "%";
    }
}

class Astronaut {
    constructor(engine, x, y) {
        this.engine = engine;
        this.startX = x; this.startY = y; this.x = x; this.y = y;
        this.tx = x + (Math.random()-0.5)*50; this.ty = y + (Math.random()-0.5)*50;
        this.speed = 0.05 + Math.random() * 0.05;
    }
    update() {
        this.y += this.engine.theme.groundSpeed;
        this.startY += this.engine.theme.groundSpeed;
        this.ty += this.engine.theme.groundSpeed;
        if(this.y > this.engine.height + 20) {
            this.y -= this.engine.height; this.startY -= this.engine.height; this.ty -= this.engine.height;
        }
        const dx = this.tx - this.x; const dy = this.ty - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 2) {
            this.tx = this.startX + (Math.random()-0.5)*80; this.ty = this.startY + (Math.random()-0.5)*80;
        } else {
            this.x += (dx/dist)*this.speed; this.y += (dy/dist)*this.speed;
        }
    }
    draw(ctx) {
        ctx.fillStyle = '#ffffff'; 
        ctx.fillRect(this.x, this.y, 1.5, 1.5);
        ctx.fillStyle = 'rgba(255, 170, 0, 0.3)';
        ctx.fillRect(this.x-1, this.y-1, 3.5, 3.5);
    }
}

class Drone {
    constructor(engine) {
        this.engine = engine; this.reset(); this.y = Math.random() * engine.height;
    }
    reset() {
        this.id = Math.floor(Math.random() * 999) + 1;
        this.x = Math.random() * this.engine.width; this.y = -50;
        this.speed = 0.3 + Math.random() * 0.3;
        this.state = 'PATROL'; this.timer = 0;
        this.tx = Math.random() * this.engine.width; this.ty = Math.random() * this.engine.height;
    }
    update() {
        this.y += this.engine.theme.groundSpeed;
        if(this.y > this.engine.height + 50) this.reset();
        if(this.state === 'PATROL') {
            const dx = this.tx - this.x; const dy = this.ty - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 5) {
                this.state = 'TASK'; this.timer = 150 + Math.random() * 100;
                // Updated military syntax for logs
                if(Math.random() > 0.8) this.engine.addLog(`UNIT-${this.id} // CHARGING`);
            } else {
                this.x += (dx/dist)*this.speed; this.y += (dy/dist)*this.speed;
            }
        } else if(this.state === 'TASK') {
            this.timer--; this.engine.totalMined += 0.02; 
            if(this.timer <= 0) {
                this.state = 'PATROL';
                this.tx = Math.random() * this.engine.width; this.ty = Math.random() * this.engine.height;
            }
        }
    }
    draw(ctx) {
        const size = 6;
        ctx.fillStyle = this.engine.theme.colors.primary;
        ctx.beginPath(); ctx.moveTo(this.x, this.y - size); ctx.lineTo(this.x + size, this.y + size); ctx.lineTo(this.x - size, this.y + size); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 8; ctx.shadowColor = this.engine.theme.colors.primary; ctx.fill(); ctx.shadowBlur = 0;
        if(this.state === 'TASK') {
            ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x, this.y + 20);
            ctx.strokeStyle = `rgba(255, 170, 0, ${0.2 + Math.random()*0.3})`; ctx.lineWidth = 2; ctx.stroke();
        }
    }
}

const engine = new MapEngine('sat-feed', VitalisTheme);

</script>
</body>
</html>
