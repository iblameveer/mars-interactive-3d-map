<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Protocol // CELESTIAL ZONE</title>
    <style>
        :root {
            --hud-primary: #e0faff; /* Ice White */
            --hud-dim: #2a4a5a;     /* Deep Slate */
            --alert-color: #00ffff; /* Cyan */
            --bg-color: #02050a;    /* Polar Night */
            --font-stack: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; user-select: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); 
            overflow: hidden; 
            font-family: var(--font-stack); 
            color: var(--hud-primary); 
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        #sat-feed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Dense Polar Grid */
        .iso-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--hud-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--hud-dim) 1px, transparent 1px);
            background-size: 60px 60px; 
            pointer-events: none; z-index: 8;
            opacity: 0.15;
        }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 2px;
            z-index: 10; pointer-events: none;
        }

        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 100%);
            z-index: 9; pointer-events: none;
        }

        .hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        
        .top-bar { 
            display: flex; justify-content: space-between; 
            border-bottom: 2px solid var(--hud-dim); 
            padding-bottom: 10px; 
            text-transform: uppercase; 
            font-size: 14px; 
            background: rgba(2, 10, 20, 0.8);
            backdrop-filter: blur(4px);
        }
        
        .blink { animation: blinker 2s ease-in-out infinite; }
        @keyframes blinker { 50% { opacity: 0.5; color: #fff; } }

        .stats-panel { 
            position: absolute; top: 90px; left: 25px; 
            background: rgba(5, 15, 30, 0.9); 
            border: 1px solid var(--hud-primary); 
            padding: 0; 
            width: 340px; 
            box-shadow: 0 0 25px rgba(200, 240, 255, 0.15); 
        }
        .stats-panel h2 { 
            margin: 0; font-size: 16px; color: #000; 
            background: var(--hud-primary); 
            padding: 8px 15px; text-transform: uppercase; 
        }
        
        .stats-content { padding: 15px; }

        .data-row { 
            display: flex; justify-content: space-between; 
            margin-bottom: 8px; font-size: 12px; 
            border-bottom: 1px solid var(--hud-dim); 
            padding-bottom: 4px; 
        }
        .data-label { color: #88aacc; text-transform: uppercase; }
        .data-val { color: #fff; text-shadow: 0 0 8px var(--hud-primary); }

        .progress-bar-track { height: 4px; background: #0a1a2a; position: relative; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: var(--hud-primary); width: 0%; box-shadow: 0 0 10px var(--hud-primary); transition: width 0.1s linear; }

        .terminal-log { 
            position: absolute; bottom: 80px; left: 25px; 
            width: 350px; height: 160px; overflow: hidden; 
            font-size: 11px; line-height: 1.5;
            color: #cceeff; 
            display: flex; flex-direction: column-reverse; 
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-left: 2px solid var(--hud-primary);
        }
        .log-entry { margin-bottom: 2px; opacity: 0.8; }
        .log-entry.new { color: #fff; opacity: 1; text-shadow: 0 0 5px #fff; }

        .coords { 
            position: absolute; bottom: 25px; right: 25px; 
            text-align: right; font-size: 12px; 
            background: rgba(0,0,0,0.8); padding: 10px; 
            border: 1px solid var(--hud-primary);
            color: #fff;
        }
    </style>
</head>
<body>

    <canvas id="sat-feed"></canvas>
    <div class="iso-grid"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="hud-layer">
        <div class="top-bar">
            <div>SAT-LINK: <span style="color:#fff">QUANTUM_RELAY_ALPHA</span></div>
            <div>FEED: <span id="feed-id">POLAR_ORBIT_LIDAR</span></div>
            <div class="blink" style="color:var(--alert-color)">● SYNCHRONIZED</div>
        </div>

        <div class="stats-panel">
            <h2>CELESTIAL // ELITE</h2>
            <div class="stats-content">
                <div class="data-row"><span class="data-label">SECTOR:</span><span class="data-val" id="sector-val">PLANUM BOREUM</span></div>
                <div class="data-row"><span class="data-label">BIOME:</span><span class="data-val">POLAR ICE CAP</span></div>
                <div class="data-row"><span class="data-label">ELEVATION:</span><span class="data-val">HIGH PLATEAU</span></div>
                <br>
                <div class="data-row"><span class="data-label">PARCELS:</span><span class="data-val">121,000 SQM</span></div>
                <div class="data-row"><span class="data-label">ORBITAL TRAFFIC:</span><span class="data-val" id="eva-count">HIGH</span></div>
                <div class="data-row"><span class="data-label">YIELD:</span><span class="data-val" id="mined-val">0</span></div>
                <div style="margin-top:15px;">
                    <div class="data-row"><span class="data-label">DATA_UPLINK</span><span class="data-val" id="progress-text">0%</span></div>
                    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
                </div>
            </div>
        </div>

        <div class="terminal-log" id="sys-log"></div>

        <div class="coords">
            <div>LAT: <span id="lat">85.000</span> N</div>
            <div>LNG: <span id="lng">0.000</span> E</div>
            <div style="color:#88aacc; font-size:10px; margin-top:4px;">TEMP: -125°C // CRYOGENIC</div>
        </div>
    </div>

<script>

/** --- CONFIGURATION --- */
const CelestialTheme = {
    name: "CELESTIAL ZONE",
    subRegion: "PLANUM BOREUM (NORTH POLE)",
    feedId: "POLAR_ORBIT_LIDAR",
    colors: {
        primary: '#e0faff', // Ice White
        dim: '#2a4a5a',     // Slate
        bg: '#02050a',      // Deep Space Navy
        feature: '#0a1520'  
    },
    groundSpeed: 0.2,       
    totalCap: 121000,       
    minedStart: 12000
};

/** --- ENGINE --- */
class MapEngine {
    constructor(canvasId, theme) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.theme = theme;
        
        this.width = window.innerWidth;
        this.height = Math.ceil(window.innerHeight);
        this.scrollY = 0;
        
        this.units = [];      
        this.stars = [];      // Independent Starfield
        this.auroraY = 0;     
        
        this.mapCanvas = document.createElement('canvas'); 
        this.totalMined = theme.minedStart;
        this.totalCap = theme.totalCap;
        
        this.resize = this.resize.bind(this);
        this.loop = this.loop.bind(this);
        
        this.init();
    }

    init() {
        const r = document.documentElement;
        r.style.setProperty('--hud-primary', this.theme.colors.primary);
        r.style.setProperty('--hud-dim', this.theme.colors.dim);
        r.style.setProperty('--bg-color', this.theme.colors.bg);
        
        document.getElementById('sector-val').innerText = this.theme.subRegion;
        document.getElementById('feed-id').innerText = this.theme.feedId;
        
        window.addEventListener('resize', this.resize);
        this.resize(); 

        this.spawnUnits(10);
        this.initStars(); // Init stars once

        this.addLog("POLAR ORBIT ESTABLISHED...");
        this.addLog("REGION: PLANUM BOREUM");
        this.addLog("DETECTING HIGH-FREQUENCY SIGNALS...");
        requestAnimationFrame(this.loop);
    }

    resize() {
        this.width = window.innerWidth;
        this.height = Math.ceil(window.innerHeight);
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        this.mapCanvas.width = this.width;
        this.mapCanvas.height = this.height;
        this.generateTerrain();
    }

    spawnUnits(count) {
        this.units = [];
        for(let i=0; i<count; i++) this.units.push(new OrbitalCruiser(this));
    }

    // New Independent Star System (Fixes the cuts)
    initStars() {
        this.stars = [];
        for(let i=0; i<150; i++) {
            this.stars.push({
                x: Math.random() * this.width,
                y: Math.random() * this.height,
                speed: 0.1 + Math.random() * 0.2, // Move slower than ground
                size: Math.random() * 1.5,
                alpha: Math.random()
            });
        }
    }

    addLog(msg) {
        const logContainer = document.getElementById('sys-log');
        const el = document.createElement('div');
        el.className = 'log-entry new';
        el.innerText = `> ${msg}`; 
        logContainer.prepend(el);
        if(logContainer.children.length > 8) logContainer.lastElementChild.remove();
        setTimeout(() => el.classList.remove('new'), 500);
    }

    // --- TERRAIN GENERATOR ---
    generateTerrain() {
        const mCtx = this.mapCanvas.getContext('2d');
        const w = this.width;
        const h = this.height;
        
        // Clear transparency
        mCtx.clearRect(0, 0, w, h);

        const drawWrapped = (fn) => {
            fn(0,0); fn(0, -h); fn(0, h); fn(-w, 0); fn(w, 0);
        };

        // 1. Ice Plateaus
        mCtx.fillStyle = '#08101a'; 
        for(let i=0; i<8; i++) {
            const cx = Math.random() * w;
            const cy = Math.random() * h;
            drawWrapped((ox, oy) => {
                mCtx.beginPath();
                mCtx.arc(cx+ox, cy+oy, 100 + Math.random()*200, 0, Math.PI*2);
                mCtx.fill();
            });
        }

        // 2. Glacial Rifts
        mCtx.strokeStyle = 'rgba(100, 200, 255, 0.15)'; 
        mCtx.lineWidth = 2;
        for(let i=0; i<12; i++) {
            const startY = Math.random() * h;
            drawWrapped((ox, oy) => {
                let y = startY + oy;
                mCtx.beginPath();
                mCtx.moveTo(0+ox, y);
                for(let x=0; x<=w; x+=30) {
                    mCtx.lineTo(x+ox, y + Math.sin(x*0.02)*40 + (Math.random()-0.5)*10);
                }
                mCtx.stroke();
            });
        }

        // 3. Structures (Skyhooks & Spires)
        const types = ['ICE_SPIRE', 'QUANTUM_ARRAY', 'RELAY_DISH'];
        for(let i=0; i<15; i++) {
            const bx = Math.random() * w;
            const by = Math.random() * h;
            const type = types[Math.floor(Math.random() * types.length)];
            drawWrapped((ox, oy) => {
                this.drawBuilding(mCtx, type, bx+ox, by+oy);
            });
        }
    }

    drawBuilding(ctx, type, x, y) {
        ctx.fillStyle = this.theme.colors.primary;
        ctx.strokeStyle = '#aaccff'; 
        
        switch(type) {
            case 'ICE_SPIRE':
                ctx.beginPath();
                ctx.moveTo(x, y-40); 
                ctx.lineTo(x+10, y+10);
                ctx.lineTo(x-10, y+10);
                ctx.closePath();
                ctx.fill();
                // Glow base
                ctx.globalAlpha = 0.3;
                ctx.beginPath(); ctx.arc(x,y+10, 15, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
                break;

            case 'QUANTUM_ARRAY':
                // Cube grid
                for(let ix=0; ix<2; ix++) {
                    for(let iy=0; iy<2; iy++) {
                        ctx.strokeRect(x + ix*12 - 6, y + iy*12 - 6, 8, 8);
                    }
                }
                break;

            case 'RELAY_DISH':
                // Skyhook Tether Point
                ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
                // Beam line up (Skyhook)
                ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x, y-1200); 
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255,255,255,0.2)'; 
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                break;
        }
    }

    // --- DYNAMIC AURORA ---
    drawAurora() {
        this.auroraY += 0.005;
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;
        
        ctx.save();
        ctx.globalCompositeOperation = 'screen'; 
        const grad = ctx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, 'rgba(0, 255, 200, 0)');
        grad.addColorStop(0.5, 'rgba(0, 255, 255, 0.08)'); 
        grad.addColorStop(1, 'rgba(0, 255, 200, 0)');
        
        ctx.fillStyle = grad;
        
        ctx.beginPath();
        ctx.moveTo(0, h/2);
        for(let x=0; x<=w; x+=10) {
            const y = h/2 + Math.sin(x*0.005 + this.auroraY*2)*100 + Math.sin(x*0.02 + this.auroraY)*50;
            ctx.lineTo(x, y);
            ctx.lineTo(x, y - 200); 
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // --- LOOP ---
    loop() {
        this.ctx.fillStyle = this.theme.colors.bg;
        this.ctx.fillRect(0,0,this.width, this.height);

        // 1. Draw Starfield (Decoupled Movement)
        this.ctx.fillStyle = '#ffffff';
        this.stars.forEach(s => {
            s.y += s.speed; // Independent speed
            if(s.y > this.height) s.y = 0;
            
            this.ctx.globalAlpha = s.alpha * (0.5 + Math.random()*0.5);
            this.ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        this.ctx.globalAlpha = 1.0;

        // 2. Draw Aurora
        this.drawAurora();

        // 3. Draw Terrain (Scrolling Texture)
        this.scrollY += this.theme.groundSpeed;
        if(this.scrollY >= this.height) this.scrollY = 0;
        const iy = Math.floor(this.scrollY);
        
        this.ctx.drawImage(this.mapCanvas, 0, iy);
        this.ctx.drawImage(this.mapCanvas, 0, iy - this.height);

        // 4. Units
        this.units.forEach(u => { u.update(); u.draw(this.ctx); });
        
        this.updateHUD();
        requestAnimationFrame(this.loop);
    }

    updateHUD() {
        document.getElementById('lat').innerText = (85.0 + (Date.now()*0.00002)%1).toFixed(4);
        
        const remaining = this.totalCap - this.totalMined;
        const pct = (this.totalMined / this.totalCap) * 100;
        
        document.getElementById('mined-val').innerText = Math.floor(this.totalMined).toLocaleString();
        document.getElementById('progress-text').innerText = pct.toFixed(5) + "%"; 
        document.getElementById('progress-fill').style.width = pct + "%";
    }
}

/** --- ORBITAL CRUISER CLASS --- */
class OrbitalCruiser {
    constructor(engine) {
        this.engine = engine;
        this.reset();
        this.y = Math.random() * engine.height;
    }
    reset() {
        this.id = Math.floor(Math.random() * 99) + 1; 
        this.x = Math.random() * this.engine.width; 
        this.y = -50;
        this.speed = 0.4 + Math.random() * 0.4; 
        this.scanAngle = 0;
    }
    update() {
        this.y += this.speed; 
        if(this.y > this.engine.height + 50) this.reset();
        this.scanAngle += 0.05;
        
        if(Math.random() > 0.995) this.engine.addLog(`SAT-${this.id} // UPLINK`);
    }
    draw(ctx) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        
        // Satellite Shape
        ctx.strokeRect(this.x-10, this.y-4, 20, 8); 
        ctx.beginPath(); 
        ctx.moveTo(this.x-10, this.y); ctx.lineTo(this.x-20, this.y); 
        ctx.moveTo(this.x+10, this.y); ctx.lineTo(this.x+20, this.y); 
        ctx.stroke();
        
        // Panels
        ctx.fillStyle = 'rgba(200, 255, 255, 0.5)';
        ctx.fillRect(this.x-25, this.y-5, 5, 10);
        ctx.fillRect(this.x+20, this.y-5, 5, 10);

        // Network Line (Connect to nearby units)
        this.engine.units.forEach(other => {
            const dx = this.x - other.x;
            const dy = this.y - other.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 180 && other !== this) {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(other.x, other.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - (dist/1800)})`;
                ctx.stroke();
            }
        });
    }
}

const engine = new MapEngine('sat-feed', CelestialTheme);

</script>
</body>
</html>
